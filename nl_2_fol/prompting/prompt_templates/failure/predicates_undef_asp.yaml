failure_prompt: |
  The following predicates in your definition are not defined yet:
  {undefined_predicates_details}
  {retry_context_section}

  Define each of them with clingo rules. The definition of a predicate may only use the predicates given as facts, the already defined predicates listed in the instructions, and the other predicates you define in this answer. Each definition starts with the rule(s) for the defined predicate (several rules for alternatives) and may be followed by rules for helper predicates. The clingo rules from the instructions apply (safe variables, no disjunction in rule bodies, `!=` for distinct atoms). Write only clingo code, no explanations.

  Example: if `oneCarbonCompound` is undefined, a valid answer defines it and the helper predicate it uses:
    - oneCarbonCompound: `oneCarbonCompound(M) :- has_atom(M, A1), c(A1), not twoPlusCarbonCompound(M).`
    - twoPlusCarbonCompound: `twoPlusCarbonCompound(M) :- has_atom(M, X), c(X), has_atom(M, Y), c(Y), X != Y.`
